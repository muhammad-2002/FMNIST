[project]
name = "pytorch-api"
version = "0.1.0"
description = "Fashion MNIST PyTorch API"
readme = "README.md"

authors = [
    { name = "Muhammad", email = "masumbilla10104@gmail.com" }
]

requires-python = ">=3.13,<3.14"

dependencies = [
    "fastapi>=0.141.1",
    "pillow>=12.3.0",
    "python-multipart>=0.0.32",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
    "uvicorn>=0.52.4",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"